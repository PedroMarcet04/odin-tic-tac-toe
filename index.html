<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div class="game-container" id="game-container"></div>
    <form id="resize-game-form">
        <legend>Size (1-100)</legend>
        <input name="size" type="number" min="1" max="100" required>
        <button type="submit">Resize game</button>
    </form>
</body>
</html>
